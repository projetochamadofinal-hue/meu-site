<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamados Para a Final</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #1a0f0a;
  color: white;
}

/* TOPO */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

.logo {
  width: 50px;
  height: 50px;
  background: #d97706;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.menu-btn {
  font-size: 26px;
  cursor: pointer;
}

/* MENU */
.menu {
  position: fixed;
  top: 0;
  right: -260px;
  width: 260px;
  height: 100%;
  background: #2a1a12;
  padding: 20px;
  transition: 0.3s;
}

.menu a {
  display: block;
  padding: 12px;
  margin: 10px 0;
  background: #3a2418;
  border-radius: 10px;
  cursor: pointer;
}

/* CONTEÚDO */
.container {
  padding: 20px;
  max-width: 400px;
  margin: auto;
  text-align: center;
}

.btn {
  background: #d97706;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
}

.card {
  background: #3a2418;
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">CF</div>
  <div class="menu-btn" onclick="abrirMenu()">☰</div>
</div>

<div id="menu" class="menu">
  <a onclick="home()">🏠 Home</a>
  <a onclick="participantes()">👤 Participantes</a>
  <a onclick="ranking()">🏆 Ranking</a>
  <a onclick="votacao()">🗳️ Votação</a>
  <a onclick="inscricoes()">📝 Inscrições</a>
  <a onclick="jogos()">🎮 Jogos</a>
  <a onclick="cronograma()">📅 Cronograma</a>
  <a onclick="fundador()">👑 Fundador</a>
</div>

<div class="container" id="app">
</div>

<script>

function abrirMenu() {
  const menu = document.getElementById("menu");
  menu.style.right = menu.style.right === "0px" ? "-260px" : "0px";
}

/* TELAS */

function home() {
  app.innerHTML = `
    <h1>CHAMADOS PARA A FINAL</h1>
    <p>Jogo bíblico dinâmico que fortalece o conhecimento na Palavra de Deus.</p>

    <div class="btn" onclick="participantes()">👤 Participantes</div>
    <div class="btn" onclick="ranking()">🏆 Ranking</div>
    <div class="btn" onclick="cronograma()">📅 Cronograma</div>
  `;
}

function participantes() {
  app.innerHTML = `
    <h1>Participantes</h1>
    <div class="card">Maria Eduarda - 16 anos</div>
    <div class="card">Miguel - 14 anos</div>
    <div class="card">Pablo - 18 anos</div>
  `;
}

function ranking() {
  app.innerHTML = `
    <h1>Ranking</h1>
    <div class="card">Maria - 0 PST</div>
    <div class="card">Miguel - 0 PST</div>
    <div class="card">Pablo - 0 PST</div>
  `;
}

function votacao() {
  app.innerHTML = `
    <h1>Votação</h1>
    <p>🕒 Disponível a partir do dia 11</p>
  `;
}

function inscricoes() {
  app.innerHTML = `
    <h1>Inscrições</h1>
    <p>Em breve</p>
  `;
}

function jogos() {
  app.innerHTML = `
    <h1>Jogos</h1>
    <p>Desafios bíblicos</p>
  `;
}

function cronograma() {
  app.innerHTML = `
    <h1>Cronograma</h1>
    <div class="card">📅 Dia 10 - Jogo</div>
    <div class="card">📅 Dia 11 - Votação</div>
  `;
}

function fundador() {
  app.innerHTML = `
    <h1>Fundador</h1>
    <p>Informações do criador</p>
  `;
}

/* INICIAR */
const app = document.getElementById("app");
home();

</script>

</body>
</html>
